name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          find . -name '*.sh' -not -path './.git/*' \
            -print0 | xargs -0 bash -n

      - name: Shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' \
            -print0 | xargs -0 shellcheck
